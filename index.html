<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuiz MHM FORTRAIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7; --primary-dark: #0369a1; --primary-light: #e0f2fe;
            --text-main: #0f172a; --text-sub: #475569; --border: #cbd5e1;
            --bg-body: #f8fafc; --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #e2e8f0; display: flex; justify-content: center; min-height: 100vh; }
        .phone-frame { width: 100%; max-width: 440px; background-color: var(--bg-body); min-height: 100vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.12); overflow-x: hidden; }
        
        .app-header { background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%); color: white; padding: 22px 20px 26px; text-align: center; border-radius: 0 0 22px 22px; }
        .app-header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
        .app-header p { font-size: 15px; color: #bae6fd; margin-top: 4px; }
        
        .main-screen { flex: 1; padding: 18px; display: flex; flex-direction: column; overflow-y: auto; margin-top: -12px; }
        .card { background: white; border-radius: var(--radius); border: 1px solid #e2e8f0; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); margin-bottom: 16px; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; }

        .form-group label { display: block; font-size: 18px; font-weight: 700; color: #334155; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 18px; font-weight: 600; background-color: #f8fafc; outline: none; margin-bottom: 16px; }
        .form-group input:focus { background: white; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12); }
        
        .btn-action { width: 100%; padding: 14px; background: var(--primary); color: white; font-size: 18px; font-weight: 800; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2); transition: background 0.2s; }
        .btn-action:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        .score-board { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 18px; border-radius: 10px; border: 1px solid #e2e8f0; font-weight: 700; color: #334155; margin-bottom: 14px; font-size: 15px; }
        .score-val { color: var(--primary); font-weight: 800; font-size: 18px; }
        
        .topik-badge { display: inline-block; background: #fef08a; color: #854d0e; font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 9999px; margin-bottom: 10px; text-transform: uppercase; }
        .soalan-box { background: #f8fafc; padding: 16px; border-radius: 10px; border-left: 4px solid var(--primary); margin-bottom: 16px; font-size: 17px; color: #0f172a; font-weight: 600; line-height: 1.55; }
        
        .pilihan-btn { padding: 13px 15px; background: white; border: 2px solid #e2e8f0; border-radius: 10px; text-align: left; font-size: 18px; font-weight: 600; color: #334155; cursor: pointer; transition: all 0.18s; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .pilihan-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); }
        .pilihan-opt-badge { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: #f1f5f9; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #64748b; border: 1px solid #cbd5e1; flex-shrink: 0; }
        .pilihan-btn.selected .pilihan-opt-badge { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* Loading Overlay */
        .loading-overlay { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:100; justify-content:center; align-items:center; flex-direction:column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom:15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Review styling */
        .review-item { background:#f8fafc; border:1px solid #e2e8f0; padding:12px; border-radius:8px; margin-bottom:12px; }
        .review-item.correct { border-left:4px solid #16a34a; }
        .review-item.wrong { border-left:4px solid #dc2626; }
    </style>
</head>
<body>

<div class="phone-frame">
    <header class="app-header">
        <h1>KUIZ ASAS MATEMATIK 1</h1>
        <p>Berdasarkan Kertas Soalan FORTRAIN</p>
    </header>

    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div style="font-weight:700; color:#334155; font-size:16px;" id="loader-text">Sila tunggu sebentar...</div>
    </div>

    <main class="main-screen">
        <!-- LOGIN -->
        <div id="screen-login" class="screen active">
            <div class="card">
                <h2 style="font-size: 20px; color: var(--primary-dark); margin-bottom: 12px; text-align:center;">Pendaftaran Calon</h2>
                <div id="pesanan-nasihat" style="background:#f0fdf4; border:1px solid #bbf7d0; padding:12px; border-radius:8px; margin-bottom:20px; font-size:14px; color:#166534; line-height:1.6; text-align:center;"></div>
                
                <div class="form-group">
                    <label>Nama Penuh:</label>
                    <input type="text" id="input-nama" placeholder="Contoh: Ali Bin Abu" required>
                    <label>Nombor Badan:</label>
                    <input type="text" id="input-id" placeholder="Contoh: PH36/C01/PT" required>
                </div>
                <button class="btn-action" onclick="mulaUjian()">MULA KUIZ SEKARANG ➔</button>
            </div>
        </div>

        <!-- KUIZ -->
        <div id="screen-quiz" class="screen">
            <div class="score-board" style="display: flex; flex-wrap: wrap; gap: 8px;">
                <div style="flex:1; min-width:100px;">Pelatih: <b id="bar-nama"></b></div>
                <div>Masa: <span id="q-timer" style="color:#ef4444; font-weight:800; background:#fee2e2; padding:2px 8px; border-radius:6px;">30:00</span></div>
                <div>Soalan: <span class="score-val" id="q-counter"></span></div>
            </div>
            <div class="card">
                <span class="topik-badge" id="q-topik">Topik</span>
                <div class="soalan-box" id="q-text"></div>
                <div id="pilihan-box"></div>
                <button class="btn-action" id="btn-next" onclick="jawabSeterusnya()" disabled>SETERUSNYA ➔</button>
            </div>
        </div>

        <!-- KEPUTUSAN -->
        <div id="screen-result" class="screen">
            <div class="card" style="text-align:center;">
                <div style="font-size: 50px; margin: 10px 0;">🏆</div>
                <h2 style="font-size: 22px; color: #0f172a; margin-bottom: 4px;">Ujian Selesai!</h2>
                <p style="font-size: 15px; color: #64748b; margin-bottom: 16px;" id="res-pelatih-info"></p>

                <div style="background: #f0fdf4; border: 2px solid #86efac; padding: 16px; border-radius: 12px; margin-bottom: 18px;">
                    <div style="font-size: 18px; font-weight: 700; color: #166534;">Markah Anda:</div>
                    <div style="font-size: 38px; font-weight: 800; color: #166534;" id="res-score"></div>
                    <div style="font-size: 15px; font-weight: 700; color: #047857;" id="res-pct"></div>
                </div>

                <button class="btn-action" onclick="hantarDataKeSheet()" style="background:#0284c7; margin-bottom:10px;">HANTAR MARKAH KE SISTEM</button>
            </div>
        </div>

        <!-- BERJAYA -->
        <div id="screen-success" class="screen">
            <div class="card" style="text-align:center; padding: 30px 20px;">
                <div style="font-size: 50px; margin-bottom: 10px;">✅</div>
                <h2 style="font-size: 22px; color: #0f172a; margin-bottom: 10px;">Penghantaran Berjaya!</h2>
                <p style="font-size: 15px; color: #64748b; line-height: 1.6; margin-bottom:20px;">Terima kasih <b id="display-nama"></b>.<br>Markah anda telah berjaya direkodkan ke sistem pengajar.</p>
                
                <button class="btn-action" onclick="tunjukSemakan()" style="background:#15803d; margin-bottom:10px;">SEMAK JAWAPAN & JALAN KIRA ▾</button>
                <button class="btn-action" onclick="location.reload()" style="background: #e2e8f0; color:#334155; box-shadow:none;">KEMBALI KE MUKA DEPAN</button>
            </div>
            <!-- Container for Semakan -->
            <div id="review-container" style="display:none; text-align:left;"></div>
        </div>

    </main>
</div>

"jawapan": 2, "penerangan": "Sisi bertentang 90 darjah ialah AC."}]]};
    
    // Peraturan agihan soalan (mesti genap 20)
    const agihanTopik = {
        "Asas & Penukaran Unit": 2,
        "Pecahan & Perpuluhan": 3,
        "Peratus": 2,
        "Nisbah & Kadar": 3,
        "Purata": 2,
        "Luas & Perimeter": 2,
        "Isipadu 3D": 3,
        "Trigonometri": 3
    };

    let quizSet = [];
    let curIdx = 0;
    let masaBerbaki = 1800; // 30 minit
    let timerInterval;
    let selectedReal = null;
    let skorAkhir = 0;
    let nama = "", noId = "";
    const appsScriptURL = "https://script.google.com/macros/s/AKfycbwCJ1_jGHLV3knMCiVgDdm328KonQdQtWrQHNOj4JJXj6nXwgBAkbeYTwe760nvRcUBXg/exec";

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function mulaUjian() {
        nama = document.getElementById('input-nama').value.trim();
        noId = document.getElementById('input-id').value.trim();
        

        if(!nama || !noId) { alert("Sila isi Nama dan Nombor Badan."); return; }

        // Penjanaan 20 soalan seimbang bab & rawak angka (Anti-Tiru)
        quizSet = [];
        for (const [topik, jumlahPerlu] of Object.entries(agihanTopik)) {
            // Ambil semua kumpulan (groups) dalam topik ini
            let groups = [...bankKategori[topik]];
            // Kocak susunan group
            groups.sort(() => Math.random() - 0.5);
            
            // Pilih N kumpulan pertama
            let selectedGroups = groups.slice(0, jumlahPerlu);
            
            // Dari setiap kumpulan yang dipilih, cabut 1 variasi rawak
            selectedGroups.forEach(grp => {
                let randomVariation = grp[Math.floor(Math.random() * grp.length)];
                // Masukkan nama topik ke dalam objek soalan
                randomVariation.topikAsal = topik;
                quizSet.push(randomVariation);
            });
        }

        // Kocak susunan 20 soalan yang telah dicabut tadi
        quizSet.sort(() => Math.random() - 0.5);

        curIdx = 0; skorAkhir = 0;
        
        document.getElementById('bar-nama').innerText = nama.split(' ')[0] + " (" + noId + ")";
        showScreen('screen-quiz');
        renderSoalan();
        mulakanTimer();
    }
    
    function mulakanTimer() {
        masaBerbaki = 30 * 60; // 30 minit x 60 saat
        clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            masaBerbaki--;
            let min = Math.floor(masaBerbaki / 60);
            let sec = masaBerbaki % 60;
            document.getElementById('q-timer').innerText = (min < 10 ? "0" + min : min) + ":" + (sec < 10 ? "0" + sec : sec);
            
            if (masaBerbaki <= 180) {
                // Merah berkelip bila tinggal 3 minit
                document.getElementById('q-timer').style.background = "#fca5a5";
                document.getElementById('q-timer').style.color = "#991b1b";
            }
            
            if (masaBerbaki <= 0) {
                clearInterval(timerInterval);
                alert("⏳ Masa 30 Minit Telah Tamat!\nUjian anda ditutup dan dibawa ke skrin markah.");
                tunjukKeputusan();
            }
        }, 1000);
    }

    function renderSoalan() {
        const q = quizSet[curIdx];
        document.getElementById('q-counter').innerText = (curIdx + 1) + "/" + quizSet.length;
        document.getElementById('q-topik').innerText = q.topikAsal;
        document.getElementById('q-text').innerText = (curIdx + 1) + ". " + q.soalan;

        // Kocak (shuffle) pilihan jawapan ABCD
        const opts = q.pilihan.map((t, i) => ({t, i})).sort(() => Math.random() - 0.5);
        const box = document.getElementById('pilihan-box');
        box.innerHTML = '';
        selectedReal = null;
        document.getElementById('btn-next').disabled = true;

        opts.forEach((o, idx) => {
            const btn = document.createElement('button');
            btn.className = 'pilihan-btn';
            btn.innerHTML = `<span class="pilihan-opt-badge">${String.fromCharCode(65+idx)}</span> <span>${o.t}</span>`;
            btn.onclick = () => {
                document.querySelectorAll('.pilihan-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedReal = o.i;
                document.getElementById('btn-next').disabled = false;
            };
            box.appendChild(btn);
        });
        
        document.getElementById('btn-next').innerText = curIdx === quizSet.length - 1 ? "HANTAR JAWAPAN ✓" : "SETERUSNYA ➔";
    }

    function jawabSeterusnya() {
        if(selectedReal === null) return;
        
        quizSet[curIdx].userSelectedRealIndex = selectedReal; // Simpan untuk semakan
        
        if (selectedReal === quizSet[curIdx].jawapan) {
            skorAkhir++;
        }
        
        curIdx++;
        if(curIdx < quizSet.length) {
            renderSoalan();
            document.querySelector('.main-screen').scrollTo({top: 0, behavior: 'smooth'});
        }
        else {
            tunjukKeputusan();
        }
    }

    function tunjukKeputusan() {
        clearInterval(timerInterval); // Hentikan timer
        const total = quizSet.length;
        const pct = Math.round((skorAkhir / total) * 100);

        document.getElementById('res-pelatih-info').innerText = `${nama} (No: ${noId})`;
        document.getElementById('res-score').innerText = `${skorAkhir} / ${total}`;
        document.getElementById('res-pct').innerText = `${pct}%`;

        // Bina semula Logik Semakan Jawapan
        const rev = document.getElementById('review-container');
        rev.innerHTML = '<h3 style="margin:16px 0 10px; font-size:16px; color:#334155;">Semakan Jawapan & Jalan Kira:</h3>';
        
        quizSet.forEach((q, i) => {
            const userChoiceRealIndex = q.userSelectedRealIndex;
            const isCorrect = userChoiceRealIndex === q.jawapan;
            
            // Get string representation of user's choice and correct choice
            const ansStr = (userChoiceRealIndex !== null && userChoiceRealIndex !== undefined) ? q.pilihan[userChoiceRealIndex] : "Tiada Jawapan (Masa Tamat)";
            const correctStr = q.pilihan[q.jawapan];

            rev.innerHTML += `
                <div class="review-item ${isCorrect ? 'correct' : 'wrong'}">
                    <div style="font-weight:bold; margin-bottom:6px; font-size:15px;">${i+1}. ${q.soalan}</div>
                    <div style="font-size:14px; margin-bottom:4px;">Jawapan Anda: <b>${ansStr}</b> ${isCorrect ? '✅' : '❌'}</div>
                    ${!isCorrect ? `<div style="font-size:14px; color:#15803d; margin-bottom:4px;">Jawapan Sebenar: <b>${correctStr}</b></div>` : ''}
                    <div style="font-size:13px; background:#fff; padding:8px; margin-top:8px; border-radius:6px; color:#475569; border: 1px dashed #cbd5e1;">💡 <b>Jalan Kira:</b> ${q.penerangan}</div>
                </div>
            `;
        });

        showScreen('screen-result');
    }

    function hantarDataKeSheet() {
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('loader-text').innerText = "Menghantar keputusan...";

        const finalUrl = appsScriptURL + "?nama=" + encodeURIComponent(nama) + "&nombadan=" + encodeURIComponent(noId) + "&skor=" + encodeURIComponent(skorAkhir + " / 20");
        
        fetch(finalUrl, {
            method: 'GET',
            mode: 'no-cors'
        })
        .then(response => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('display-nama').innerText = nama;
            showScreen('screen-success');
        })
        .catch(error => {
            document.getElementById('loader').style.display = 'none';
            alert("Ralat penghantaran! Sila semak sambungan internet anda.\n\nInfo: " + error);
        });
    }

    function tunjukSemakan() {
        const box = document.getElementById('review-container');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }
</script>
